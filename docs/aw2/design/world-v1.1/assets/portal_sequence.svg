<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><defs><filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#143047" flood-opacity="0.15"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547589"/></marker></defs><rect width="1200" height="430" fill="#f6f8fc"/><text x="35" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#183549">Chu trình chuyển map qua cửa — trạng thái an toàn</text><rect x="30" y="140" width="212" height="163" rx="18" fill="#e6f5e8" stroke="#d5dfe6" stroke-width="2" filter="url(#shadow)"/><text x="136" y="192" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#203d52">Cửa ngoài trời</text><text x="136" y="227" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#586f7d">Nhân vật chạm trigger</text><path d="M 244 222 L 263 222" stroke="#547589" stroke-width="4" marker-end="url(#arr)"/><rect x="266" y="140" width="212" height="163" rx="18" fill="#fff1df" stroke="#d5dfe6" stroke-width="2" filter="url(#shadow)"/><text x="372" y="192" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#203d52">Xác nhận điều kiện</text><text x="372" y="227" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#586f7d">Khóa? quest? cooldown?</text><path d="M 480 222 L 499 222" stroke="#547589" stroke-width="4" marker-end="url(#arr)"/><rect x="502" y="140" width="212" height="163" rx="18" fill="#e4efff" stroke="#d5dfe6" stroke-width="2" filter="url(#shadow)"/><text x="608" y="192" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#203d52">Transition</text><text x="608" y="227" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#586f7d">Đóng input, preload</text><path d="M 716 222 L 735 222" stroke="#547589" stroke-width="4" marker-end="url(#arr)"/><rect x="738" y="140" width="212" height="163" rx="18" fill="#e6f5e8" stroke="#d5dfe6" stroke-width="2" filter="url(#shadow)"/><text x="844" y="192" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#203d52">Spawn trong nhà</text><text x="844" y="227" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#586f7d">Đặt đúng điểm hợp lệ</text><path d="M 952 222 L 971 222" stroke="#547589" stroke-width="4" marker-end="url(#arr)"/><rect x="974" y="140" width="212" height="163" rx="18" fill="#f5e9fb" stroke="#d5dfe6" stroke-width="2" filter="url(#shadow)"/><text x="1080" y="192" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#203d52">Điều khiển trở lại</text><text x="1080" y="227" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="400" fill="#586f7d">NPC / đồ vật / cửa ra</text><text x="35" y="351" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#8e5540">Nếu lỗi tải map hoặc spawn không tồn tại: huỷ chuyển cảnh, quay lại điểm an toàn trước cửa.</text><text x="35" y="387" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#5f7583">Khi đi ra: portal đảo chiều đưa người chơi về đúng cửa ngoài (không đưa về điểm spawn ngẫu nhiên).</text></svg>