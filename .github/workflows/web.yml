name: Web quality
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'android/**'
      - 'dev/artifacts/**'
  push:
    branches: [master]
    paths-ignore:
      - 'android/**'
      - 'dev/artifacts/**'
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm typecheck:dev && pnpm test && pnpm validate:catalog
      - run: pnpm validate:assets && pnpm release:verify && pnpm build && pnpm release:size
      - run: node --check dist/sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: Soul-of-Meal-web-${{ github.sha }}
          path: dist
          retention-days: 7
