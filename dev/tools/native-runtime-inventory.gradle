gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('runtimeInventory') {
        doLast {
            def entries=app.configurations.debugRuntimeClasspath.incoming.resolutionResult.allComponents.findAll { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }.collect { c -> [group:c.id.group,name:c.id.module,version:c.id.version] }.sort { it.group + ':' + it.name }
            println('NATIVE_DEP_JSON=' + groovy.json.JsonOutput.toJson(entries))
        }
    }
}
